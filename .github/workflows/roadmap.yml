# Refreshes src/data/roadmap.json from the project board once a day.
#
# Does nothing until the repository secret ROADMAP_TOKEN exists. That secret is
# a fine-grained personal access token with read-only access (see README,
# "Roadmap data"). The token is only used to read the board; the commit and the
# deploy run with this repository's own GITHUB_TOKEN.

name: Refresh roadmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: roadmap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$ROADMAP_TOKEN" ]; then
            echo "ROADMAP_TOKEN is not set: nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.token.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Export the board
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
        run: node scripts/export-roadmap.mjs

      - name: Commit if anything changed
        id: commit
        if: steps.token.outputs.ready == 'true'
        run: |
          # The export stamps the time it ran; only commit when the board changed.
          if git diff --quiet -I '"generated"' -- src/data/roadmap.json; then
            echo "Board unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/roadmap.json
            git commit -m "Roadmap: refresh from the project board"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not start other workflows, so start
      # the deploy explicitly.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
